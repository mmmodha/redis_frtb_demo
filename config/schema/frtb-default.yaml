# FRTB-SA Default Schema
# -----------------------
# Synthetic schema derived from BCBS d457 / MAR21 §21.4–§21.8.
# Drives generator, ingest, RQE indexes, and SBM calc bindings.
# When HSBC sends their real schema we swap this file (SCHEMA_FILE=...).
#
# Conventions:
#   - "indexed: true" → FT.CREATE adds the field to the RQE schema.
#     Keep total indexed ≈ 10–15 of ~110 dims (RQE memory budget).
#   - "hash_tag_role: primary" → participates in {risk_class}:{bucket} hash tag
#     so per-bucket FCALL is slot-local.
#   - tenor curves live in a single ARRAY_NUMERIC dimension — no row explosion.
version: 1

dimensions:
  # ---- Common / cross-class identifiers + booking ----
  - { name: risk_class, type: TAG, indexed: true, sortable: false, hash_tag_role: primary, cardinality_hint: 7 }
  - { name: bucket, type: TAG, indexed: true, sortable: false, hash_tag_role: primary, cardinality_hint: 25 }
  - { name: tenor, type: TAG, indexed: true, sortable: true, cardinality_hint: 12 }
  - { name: risk_value, type: ARRAY_NUMERIC, indexed: false, sortable: false }
  - { name: weight, type: NUMERIC, indexed: false, sortable: false }
  - { name: sensitivity_type, type: TAG, indexed: true, sortable: false, cardinality_hint: 3 }
  - { name: as_of_date, type: TAG, indexed: true, sortable: true, cardinality_hint: 30 }
  - { name: calc_date, type: TAG, indexed: false, sortable: true }
  - { name: currency, type: TAG, indexed: true, sortable: false, cardinality_hint: 30 }
  - { name: ccy_pair, type: TAG, indexed: false, sortable: false }
  - { name: desk, type: TAG, indexed: true, sortable: false, cardinality_hint: 200 }
  - { name: book, type: TAG, indexed: false, sortable: false }
  - { name: portfolio, type: TAG, indexed: false, sortable: false }
  - { name: legal_entity, type: TAG, indexed: false, sortable: false }
  - { name: trader, type: TAG, indexed: false, sortable: false }
  - { name: trade_id, type: TAG, indexed: false, sortable: false }
  - { name: position_id, type: TAG, indexed: false, sortable: false }
  - { name: instrument_id, type: TAG, indexed: false, sortable: false }
  - { name: instrument_type, type: TAG, indexed: false, sortable: false }
  - { name: asof_ts, type: NUMERIC, indexed: false, sortable: true }
  - { name: sensitivity_id, type: TAG, indexed: false, sortable: false }
  - { name: source_system, type: TAG, indexed: false, sortable: false }
  - { name: version, type: NUMERIC, indexed: false, sortable: false }

  # ---- GIRR (General Interest Rate Risk) §21.40–§21.46 ----
  - { name: girr_curve_type, type: TAG, indexed: false, sortable: false }    # yield / swap / basis
  - { name: girr_basis_type, type: TAG, indexed: false, sortable: false }
  - { name: girr_inflation_curve, type: TAG, indexed: false, sortable: false }
  - { name: girr_repo_rate, type: NUMERIC, indexed: false, sortable: false }
  - { name: girr_vol_option_maturity, type: TAG, indexed: false, sortable: false }
  - { name: girr_vol_underlying_maturity, type: TAG, indexed: false, sortable: false }
  - { name: girr_moneyness, type: NUMERIC, indexed: false, sortable: false }
  - { name: girr_volatility_type, type: TAG, indexed: false, sortable: false }
  - { name: girr_xccy_basis, type: NUMERIC, indexed: false, sortable: false }
  - { name: girr_curve_node, type: TAG, indexed: false, sortable: false }

  # ---- CSR non-securitisation §21.50–§21.55 ----
  - { name: csr_credit_quality, type: TAG, indexed: true, sortable: false, cardinality_hint: 2 }  # IG/HY
  - { name: csr_issuer_id, type: TAG, indexed: false, sortable: false }
  - { name: csr_issuer_name, type: TAG, indexed: false, sortable: false }
  - { name: csr_issuer_sector, type: TAG, indexed: false, sortable: false }
  - { name: csr_issuer_region, type: TAG, indexed: false, sortable: false }
  - { name: csr_seniority, type: TAG, indexed: false, sortable: false }
  - { name: csr_rating, type: TAG, indexed: false, sortable: false }
  - { name: csr_spread_curve_type, type: TAG, indexed: false, sortable: false }
  - { name: csr_cds_basis, type: NUMERIC, indexed: false, sortable: false }
  - { name: csr_cds_recovery_rate, type: NUMERIC, indexed: false, sortable: false }
  - { name: csr_ref_obligation, type: TAG, indexed: false, sortable: false }
  - { name: csr_restructuring_type, type: TAG, indexed: false, sortable: false }

  # ---- CSR securitisation (non-CTP) §21.60–§21.65 ----
  - { name: csrsec_tranche, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_attachment, type: NUMERIC, indexed: false, sortable: false }
  - { name: csrsec_detachment, type: NUMERIC, indexed: false, sortable: false }
  - { name: csrsec_pool_type, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_geographic_region, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_vintage, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_originator, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_servicer, type: TAG, indexed: false, sortable: false }
  - { name: csrsec_credit_enhancement, type: NUMERIC, indexed: false, sortable: false }
  - { name: csrsec_payment_priority, type: TAG, indexed: false, sortable: false }

  # ---- CSR securitisation CTP §21.70–§21.75 ----
  - { name: ctp_tranche_seniority, type: TAG, indexed: false, sortable: false }
  - { name: ctp_index_name, type: TAG, indexed: false, sortable: false }
  - { name: ctp_series, type: TAG, indexed: false, sortable: false }
  - { name: ctp_version, type: TAG, indexed: false, sortable: false }
  - { name: ctp_basket_type, type: TAG, indexed: false, sortable: false }
  - { name: ctp_correlation, type: NUMERIC, indexed: false, sortable: false }
  - { name: ctp_recovery_assumption, type: NUMERIC, indexed: false, sortable: false }
  - { name: ctp_strike, type: NUMERIC, indexed: false, sortable: false }
  - { name: ctp_attachment_point, type: NUMERIC, indexed: false, sortable: false }

  # ---- Equity §21.78–§21.83 ----
  - { name: equity_issuer_id, type: TAG, indexed: false, sortable: false }
  - { name: equity_sector_code, type: TAG, indexed: false, sortable: false }
  - { name: equity_market_cap, type: TAG, indexed: false, sortable: false }       # large / small
  - { name: equity_market_region, type: TAG, indexed: false, sortable: false }    # emerging / advanced
  - { name: equity_spot_or_repo, type: TAG, indexed: true, sortable: false, cardinality_hint: 2 }
  - { name: equity_vol_type, type: TAG, indexed: false, sortable: false }
  - { name: equity_moneyness, type: NUMERIC, indexed: false, sortable: false }
  - { name: equity_option_maturity, type: TAG, indexed: false, sortable: false }
  - { name: equity_index_membership, type: TAG, indexed: false, sortable: false }
  - { name: equity_dividend_yield, type: NUMERIC, indexed: false, sortable: false }

  # ---- Commodity §21.85–§21.90 ----
  - { name: commodity_class, type: TAG, indexed: false, sortable: false }
  - { name: commodity_contract_grade, type: TAG, indexed: false, sortable: false }
  - { name: commodity_delivery_location, type: TAG, indexed: false, sortable: false }
  - { name: commodity_delivery_month, type: TAG, indexed: false, sortable: false }
  - { name: commodity_tenor_dim, type: TAG, indexed: false, sortable: false }
  - { name: commodity_basis_type, type: TAG, indexed: false, sortable: false }
  - { name: commodity_vol_type, type: TAG, indexed: false, sortable: false }
  - { name: commodity_moneyness, type: NUMERIC, indexed: false, sortable: false }
  - { name: commodity_strike, type: NUMERIC, indexed: false, sortable: false }
  - { name: commodity_forward_curve, type: TAG, indexed: false, sortable: false }
  - { name: commodity_contract_type, type: TAG, indexed: false, sortable: false }
  - { name: commodity_settlement_type, type: TAG, indexed: false, sortable: false }
  - { name: commodity_curve_node, type: TAG, indexed: false, sortable: false }

  # ---- FX §21.88–§21.95 ----
  - { name: fx_base_currency, type: TAG, indexed: false, sortable: false }
  - { name: fx_quote_currency, type: TAG, indexed: false, sortable: false }
  - { name: fx_vol_type, type: TAG, indexed: false, sortable: false }
  - { name: fx_moneyness, type: NUMERIC, indexed: false, sortable: false }
  - { name: fx_option_maturity, type: TAG, indexed: false, sortable: false }
  - { name: fx_smile_dim, type: TAG, indexed: false, sortable: false }

  # ---- Cross-class auxiliary dimensions ----
  - { name: scenario_id, type: TAG, indexed: false, sortable: false }
  - { name: shock_size_bp, type: NUMERIC, indexed: false, sortable: false }
  - { name: shock_direction, type: TAG, indexed: false, sortable: false }
  - { name: model_id, type: TAG, indexed: false, sortable: false }
  - { name: model_version, type: TAG, indexed: false, sortable: false }
  - { name: confidence_level, type: NUMERIC, indexed: false, sortable: false }
  - { name: jurisdiction, type: TAG, indexed: false, sortable: false }
  - { name: regulator, type: TAG, indexed: false, sortable: false }
  - { name: reporting_currency, type: TAG, indexed: false, sortable: false }
  - { name: fx_translation_rate, type: NUMERIC, indexed: false, sortable: false }
  - { name: provenance_hash, type: TAG, indexed: false, sortable: false }
  - { name: lineage_batch_id, type: TAG, indexed: false, sortable: false }
  - { name: ingest_ts, type: NUMERIC, indexed: false, sortable: true }
  - { name: notes, type: TEXT, indexed: false, sortable: false }
  - { name: tags_csv, type: TAG, indexed: false, sortable: false }
  - { name: position_quantity, type: NUMERIC, indexed: false, sortable: false }
  - { name: market_value, type: NUMERIC, indexed: false, sortable: false }
  - { name: pnl, type: NUMERIC, indexed: false, sortable: false }

frtb_binding:
  risk_class: risk_class
  bucket: bucket
  tenor: tenor
  risk_value: risk_value
  weight: weight
  sensitivity_type: sensitivity_type

risk_classes:
  GIRR:
