      - risk_class
      - bucket
      - tenor
      - risk_value
      - weight
      - sensitivity_type
      - currency
      - desk
      - book
      - trade_id
      - girr_curve_type
      - girr_basis_type
      - girr_inflation_curve
      - girr_repo_rate
      - girr_vol_option_maturity
      - girr_vol_underlying_maturity
      - girr_moneyness
      - girr_volatility_type
      - girr_xccy_basis
      - girr_curve_node
    buckets:
      naming: currency
      values: [USD, EUR, GBP, JPY, CHF, CAD, AUD, SEK, NOK, NZD, OTHER]
    tenor:
      count: 10
      nodes: ["3M", "6M", "1Y", "2Y", "3Y", "5Y", "10Y", "15Y", "20Y", "30Y"]
    risk_weights_ref: girr_delta_weights
    intra_bucket_correlation_ref: girr_rho_kl
