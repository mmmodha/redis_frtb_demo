risk_weights:
  girr_delta_weights:
    description: GIRR delta risk weights per tenor (MAR21.42 — illustrative magnitudes)
    by_tenor:
      "3M": 0.017
      "6M": 0.017
      "1Y": 0.016
      "2Y": 0.013
      "3Y": 0.012
      "5Y": 0.011
      "10Y": 0.011
      "15Y": 0.011
      "20Y": 0.011
      "30Y": 0.011
  csr_non_sec_weights:
    description: CSR non-sec illustrative weights per bucket
    by_bucket: { "1": 0.005, "2": 0.010, "3": 0.050, "4": 0.030, "5": 0.030,
                 "6": 0.020, "7": 0.015, "8": 0.025, "9": 0.030, "10": 0.030,
                 "11": 0.040, "12": 0.045, "13": 0.030, "14": 0.080, "15": 0.120, "16": 0.080 }
  csr_sec_non_ctp_weights:
    description: CSR sec non-CTP weights placeholder
    constant: 0.040
  csr_sec_ctp_weights:
    description: CSR sec CTP weights placeholder
    constant: 0.060
  equity_weights:
    description: Equity risk weights per bucket (MAR21.78)
    by_bucket: { "1": 0.55, "2": 0.60, "3": 0.45, "4": 0.55, "5": 0.30,
                 "6": 0.35, "7": 0.40, "8": 0.50, "9": 0.70, "10": 0.50,
                 "11": 0.70, "12": 0.15, "13": 0.25 }
  commodity_weights:
    description: Commodity risk weights per bucket (MAR21.82)
    by_bucket: { "1": 0.30, "2": 0.35, "3": 0.60, "4": 0.80, "5": 0.40,
                 "6": 0.45, "7": 0.20, "8": 0.35, "9": 0.25, "10": 0.35, "11": 0.50 }
  fx_weights:
    description: FX risk weight (single weight applied — MAR21.88)
    constant: 0.075

correlations:
  girr_rho_kl:
    description: GIRR intra-bucket tenor correlation (single representative ρ_kl)
    kind: constant
    value: 0.99
  girr_gamma_bc:
    description: GIRR cross-bucket correlation γ_bc (single representative)
    kind: constant
    value: 0.50
  csr_non_sec_rho:
    kind: constant
    value: 0.65
  csr_non_sec_gamma:
    kind: constant
    value: 0.20
  csr_sec_non_ctp_rho:
    kind: constant
    value: 0.60
  csr_sec_non_ctp_gamma:
    kind: constant
    value: 0.10
  csr_sec_ctp_rho:
    kind: constant
    value: 0.70
  csr_sec_ctp_gamma:
    kind: constant
    value: 0.15
  equity_rho:
    kind: constant
    value: 0.50
  equity_gamma:
    kind: constant
    value: 0.15
  commodity_rho:
    kind: constant
    value: 0.55
  commodity_gamma:
    kind: constant
    value: 0.20
  fx_rho:
    kind: constant
    value: 0.60
  fx_gamma:
    kind: constant
    value: 0.60
