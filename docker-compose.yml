# FRTB SBM PoV — application services only.
# Redis runs as Redis Enterprise Software inside the bank's perimeter (now also the
# model for our demo: the user supplies REDIS_URL via .env.local pointing at
# their own Redis Enterprise cluster). No Redis container is started by this
# compose file. A dev-only Redis Stack container is available behind the
# "dev-redis" profile for local development without a Cloud account.
#
# Wave 5.2: every Redis-touching service receives REDIS_URL / REDIS_TLS /
# REDIS_CLUSTER from the host's .env.local (gitignored). The .env.example at
# repo root documents the expected shape — never commit real credentials.

name: frtb-sbm-redis-pov

networks:
  frtb:
    driver: bridge

volumes:
  data:

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - frtb
  init: true
  # Reach Redis (or other services) running on the laptop host from inside
  # containers. On Docker Desktop (Mac/Win) this hostname already exists;
  # on Linux Compose maps it to the host gateway.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_URL: http://api:8080
  # Wave 5.16u: shared static bearer for the api's internal full-credential
  # endpoint (/internal/redis/active-target/full). source and loadgen poll
  # this to follow profile switches without re-encoding the connection store.
  # Override via .env.local; the dev default is fine for local docker-compose
  # but MUST be replaced for any reachable demo.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}

# Wave 7 defaults — mirror scripts/run-local.sh `apply_defaults` so Docker
# and bare-metal behave identically for bulk ingest + lazy-math calc.
x-wave7-env: &wave7-env
  CALC_LAZY_MATH: ${CALC_LAZY_MATH:-1}
  ENABLE_SLIM_SENS_INDEX: ${ENABLE_SLIM_SENS_INDEX:-1}
  LIVE_TAIL_MODE: ${LIVE_TAIL_MODE:-true}

# app + wave7 (Compose allows one `<<:` merge key per mapping).
x-app-wave7-env: &app-wave7-env
  <<: *app-env
  CALC_LAZY_MATH: ${CALC_LAZY_MATH:-1}
  ENABLE_SLIM_SENS_INDEX: ${ENABLE_SLIM_SENS_INDEX:-1}
  LIVE_TAIL_MODE: ${LIVE_TAIL_MODE:-true}

# Calc/query pool sizing for large clusters (override in .env.local for 400M).
x-calc-pool-env: &calc-pool-env
  RUNTIME_REDIS_POOL_SIZE_HEAVY_CALC: ${RUNTIME_REDIS_POOL_SIZE_HEAVY_CALC:-8}
  RUNTIME_REDIS_POOL_SIZE_HEAVY_INGEST: ${RUNTIME_REDIS_POOL_SIZE_HEAVY_INGEST:-4}
  RUNTIME_REDIS_POOL_SIZE_LIGHT: ${RUNTIME_REDIS_POOL_SIZE_LIGHT:-4}
  MAX_INFLIGHT_HEAVY: ${MAX_INFLIGHT_HEAVY:-24}
  MAX_INFLIGHT_LIGHT: ${MAX_INFLIGHT_LIGHT:-12}

x-api-env: &api-env
  <<: *app-wave7-env
  RUNTIME_REDIS_POOL_SIZE_HEAVY_CALC: ${RUNTIME_REDIS_POOL_SIZE_HEAVY_CALC:-8}
  RUNTIME_REDIS_POOL_SIZE_HEAVY_INGEST: ${RUNTIME_REDIS_POOL_SIZE_HEAVY_INGEST:-4}
  RUNTIME_REDIS_POOL_SIZE_LIGHT: ${RUNTIME_REDIS_POOL_SIZE_LIGHT:-4}
  MAX_INFLIGHT_HEAVY: ${MAX_INFLIGHT_HEAVY:-24}
  MAX_INFLIGHT_LIGHT: ${MAX_INFLIGHT_LIGHT:-12}
  # 5M+ row portfolios: Total SBM wall-clock can exceed 2 min; per-command
  # budget must outlast slow FT.AGGREGATE cells (default 35s was too low).
  POOL_COMMAND_TIMEOUT_HEAVY_CALC_MS: ${POOL_COMMAND_TIMEOUT_HEAVY_CALC_MS:-180000}
  RUNTIME_REDIS_COMMAND_TIMEOUT_MS: ${RUNTIME_REDIS_COMMAND_TIMEOUT_MS:-180000}
  CALC_CACHE_TTL_MS: ${CALC_CACHE_TTL_MS:-300000}
  HEALTH_PORT: 8080
  CONN_STORE_FILE: /data/connections.enc.json
  CONN_STORE_KEY: ${CONN_STORE_KEY:-dev-only-change-in-prod}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  SCHEMA_FILE: ${SCHEMA_FILE:-/app/config/schema/frtb-default.yaml}
  SOURCE_BASE: http://source:8082
  LOADGEN_BASE: http://loadgen:8085
  BULK_LOADER_URL: http://bulk-loader:8086

x-ingest-env: &ingest-env
  <<: *app-wave7-env
  HEALTH_PORT: 8083
  STREAM_SHARDS: ${STREAM_SHARDS:-1}
  SHARD_ASSIGNMENT: ${SHARD_ASSIGNMENT:-all}

x-bulk-loader-env: &bulk-loader-env
  BULK_LOADER_POOL_SIZE: ${BULK_LOADER_POOL_SIZE:-16}
  BULK_LOADER_BATCH_SIZE: ${BULK_LOADER_BATCH_SIZE:-2000}
  BULK_LOADER_IDLE_FLUSH_MS: ${BULK_LOADER_IDLE_FLUSH_MS:-50}

x-bulk-loader-service-env: &bulk-loader-service-env
  <<: *app-env
  BULK_LOADER_POOL_SIZE: ${BULK_LOADER_POOL_SIZE:-16}
  BULK_LOADER_BATCH_SIZE: ${BULK_LOADER_BATCH_SIZE:-2000}
  BULK_LOADER_IDLE_FLUSH_MS: ${BULK_LOADER_IDLE_FLUSH_MS:-50}
  HEALTH_PORT: 8086
  API_BASE: http://api:8080

# Redis connection env (REDIS_URL / REDIS_TLS / REDIS_CLUSTER) is sourced
# from the host's `.env.local` (gitignored) via the `env_file` directive on
# every Redis-touching service. This means `docker compose up` (with NO
# `--env-file` flag) picks the real cluster URL up automatically — Compose
# v2's project-level auto-load only covers `.env`, never `.env.local`, and
# Wave 5.5's smoke run proved that interpolating `${REDIS_URL:-}` in the
# `environment:` block silently overrode the env_file value back to "".
# `required: false` keeps the `dev-redis` profile usable without `.env.local`.
x-env-file: &env-file
  - path: .env.local
    required: false

services:
  ui:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: *env-file
    environment:
      <<: *api-env
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  generator:
    <<: *service-defaults
    # Wave 7.0.8: included in the default stack. docker-entrypoint.sh sleeps
    # when no args are passed so `compose up --wait` stays healthy; invoke
    # the CLI with `docker compose run --rm generator --rows N`.
    build:
      context: .
      dockerfile: services/generator/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8081
      # Wave 5.6.2: point the CLI at the schema baked into the image at
      # /app/config/schema/ (see services/generator/Dockerfile). Without this
      # the container exits with "schema file path missing".
      SCHEMA_FILE: ${SCHEMA_FILE:-/app/config/schema/frtb-default.yaml}
      API_BASE: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  source:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/source/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8082
      # Wave 5.79: point the active-target watcher at the api container's
      # service hostname. Wave 5.78 swapped the code default from
      # http://api:8080 to http://localhost:8080 for laptop use, so
      # compose must override it to restore inter-container resolution.
      API_BASE: http://api:8080
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Wave 5.92B: ingest scales horizontally via per-stream consumer-groups.
  # When STREAM_SHARDS > 1, each replica spawns one XREADGROUP loop per
  # shard listed in SHARD_ASSIGNMENT (`"all"` / `"0,2,4"` / `"0-3"`) against
  # the per-shard streams `sensitivities:in:{<n>}`. Scale replicas with:
  #   STREAM_SHARDS=4 docker compose up -d --scale ingest=2 --build ingest
  # Each replica shares the same consumer-group name, so giving them disjoint
  # SHARD_ASSIGNMENT lists pins each replica to its own subset; leaving both
  # on the default ("all") lets the consumer-group's natural load-balancing
  # spread pending entries across replicas. With STREAM_SHARDS=1 (default)
  # the service preserves the legacy single-stream, single-consumer behaviour.
  ingest:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    env_file: *env-file
    environment:
      <<: *ingest-env
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  calc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/calc/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8084
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  loadgen:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/loadgen/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8085
      # Wave 5.79: point the runner + active-target watcher at the api
      # container's service hostname. Wave 5.78 swapped the code default from
      # http://api:8080 to http://localhost:8080 for laptop use, so compose
      # must override it to restore inter-container resolution.
      API_BASE: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Wave 7.0.7: bulk-loader service with horizontal scaling support. Each
  # replica spawns BULK_LOADER_POOL_SIZE workers (default 8), so scaling to
  # 4 replicas on a 32vCPU VM distributes 32 total workers across the VM's
  # cores. No ports exposed — generator/UI reach bulk-loader via internal
  # network only. Scale with: `docker compose up -d --scale bulk-loader=4`.
  bulk-loader:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/bulk-loader/Dockerfile
    env_file: *env-file
    environment:
      <<: *bulk-loader-service-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Dev-only Redis Stack container, NOT started in the demo compose flow.
  # Activate with: `docker compose --profile dev-redis up`.
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    profiles: ["dev-redis"]
    networks:
      - frtb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
