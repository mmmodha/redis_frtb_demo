# FRTB SBM PoV — application services only.
# Redis runs as Redis Enterprise Software inside HSBC's perimeter (now also the
# model for our demo: the user supplies REDIS_URL via .env.local pointing at
# their own Redis Enterprise cluster). No Redis container is started by this
# compose file. A dev-only Redis Stack container is available behind the
# "dev-redis" profile for local development without a Cloud account.
#
# Wave 5.2: every Redis-touching service receives REDIS_URL / REDIS_TLS /
# REDIS_CLUSTER from the host's .env.local (gitignored). The .env.example at
# repo root documents the expected shape — never commit real credentials.

name: frtb-sbm-redis-pov

networks:
  frtb:
    driver: bridge

volumes:
  data:

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - frtb
  init: true

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_URL: http://api:8080

# Redis connection env (REDIS_URL / REDIS_TLS / REDIS_CLUSTER) is sourced
# from the host's `.env.local` (gitignored) via the `env_file` directive on
# every Redis-touching service. This means `docker compose up` (with NO
# `--env-file` flag) picks the real cluster URL up automatically — Compose
# v2's project-level auto-load only covers `.env`, never `.env.local`, and
# Wave 5.5's smoke run proved that interpolating `${REDIS_URL:-}` in the
# `environment:` block silently overrode the env_file value back to "".
# `required: false` keeps the `dev-redis` profile usable without `.env.local`.
x-env-file: &env-file
  - path: .env.local
    required: false

services:
  ui:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8080
      CONN_STORE_KEY: ${CONN_STORE_KEY:-dev-only-change-in-prod}
      # Wave 5.8.5: point seedConnections() at the bind-mounted fixture so the
      # `demo-cluster` / `scale-cluster` profiles auto-appear in the Connections
      # panel on api boot — required by the live e2e (e2e/full-demo.spec.ts).
      SEED_CONNECTIONS_FILE: /app/fixtures/seed-connections.json
    ports:
      - "8080:8080"
    volumes:
      - data:/data
      - ./services/api/fixtures/seed-connections.json:/app/fixtures/seed-connections.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  generator:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/generator/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8081
      # Wave 5.6.2: point the CLI at the schema baked into the image at
      # /app/config/schema/ (see services/generator/Dockerfile). Without this
      # the container exits with "schema file path missing".
      SCHEMA_FILE: ${SCHEMA_FILE:-/app/config/schema/frtb-default.yaml}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  source:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/source/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8082
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingest:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8083
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  calc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/calc/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8084
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  loadgen:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/loadgen/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      HEALTH_PORT: 8085
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Dev-only Redis Stack container, NOT started in the demo compose flow.
  # Activate with: `docker compose --profile dev-redis up`.
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    profiles: ["dev-redis"]
    networks:
      - frtb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
