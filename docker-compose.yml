# FRTB SBM PoV — application services only.
# Redis runs as Redis Enterprise Software inside HSBC's perimeter and is configured
# via the UI Connections panel; no Redis container is started by this compose file.
# A dev-only Redis Stack container is available behind the "dev-redis" profile for
# local development without a Cloud account, but is never auto-started.

name: frtb-sbm-redis-pov

networks:
  frtb:
    driver: bridge

volumes:
  data:

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - frtb
  init: true

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_URL: http://api:8080

services:
  ui:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8080
      CONN_STORE_KEY: ${CONN_STORE_KEY:-dev-only-change-in-prod}
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  generator:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/generator/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8081
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  source:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/source/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8082
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingest:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8083
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  calc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/calc/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8084
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  loadgen:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/loadgen/Dockerfile
    environment:
      <<: *app-env
      HEALTH_PORT: 8085
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Dev-only Redis Stack container, NOT started in the demo compose flow.
  # Activate with: `docker compose --profile dev-redis up`.
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    profiles: ["dev-redis"]
    networks:
      - frtb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
