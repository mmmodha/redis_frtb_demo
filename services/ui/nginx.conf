# Wave 5.1 / TLS — nginx serves the built Vite SPA.
# :443 is the only host-published port (TLS). :3000 stays container-local for
# the compose healthcheck so probes do not need to trust the TLS cert.
# React-router uses HTML5 history, so unknown paths fall back to index.html.
server {
    listen 3000;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck contract: must keep returning 200 on /healthz.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"ui","status":"ok"}';
    }

    # Static assets — let Vite-hashed files cache aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Wave 5.21h — never cache index.html so deploys ship immediately and the
    # browser cannot serve a stale shell that references a deleted bundle hash.
    # Manual verification (no nginx test harness today):
    #   curl -skI https://localhost/        | grep -i cache-control
    #     → cache-control: no-store, no-cache, must-revalidate
    #   curl -skI https://localhost/assets/index-<hash>.js | grep -i cache-control
    #     → cache-control: public, immutable
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Wave 6.05 — same-origin reverse-proxy for the browser → API path. The
    # bundle's apiBase() defaults to "/api"; the trailing slash on proxy_pass
    # strips the /api prefix before forwarding to the API container. Buffering
    # is disabled so SSE streams and large uploads pass through unmodified.
    location /api/ {
        proxy_pass http://api:8080/;              # trailing slash strips /api
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       24h;
        proxy_send_timeout       24h;
        proxy_request_buffering  off;
        client_max_body_size     0;
    }

    # SPA fallback — any unknown path serves index.html so react-router can
    # handle the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
