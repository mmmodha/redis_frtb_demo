# Wave 5.1 — nginx serves the built Vite SPA + a /healthz endpoint for the
# docker-compose healthcheck (preserves the contract the placeholder Dockerfile
# exposed). React-router uses HTML5 history, so unknown paths fall back to
# index.html.
server {
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck contract: must keep returning 200 on /healthz.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"ui","status":"ok"}';
    }

    # Static assets — let Vite-hashed files cache aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Wave 5.21h — never cache index.html so deploys ship immediately and the
    # browser cannot serve a stale shell that references a deleted bundle hash.
    # Manual verification (no nginx test harness today):
    #   curl -sI http://localhost:3000/        | grep -i cache-control
    #     → cache-control: no-store, no-cache, must-revalidate
    #   curl -sI http://localhost:3000/assets/index-<hash>.js | grep -i cache-control
    #     → cache-control: public, immutable
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA fallback — any unknown path serves index.html so react-router can
    # handle the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
